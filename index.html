<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>South Scene Cars</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(
          to bottom right,
          rgba(0, 188, 212, 0.2),
          rgba(0, 188, 212, 0.5)
        ),
        url('https://images.unsplash.com/photo-1593642532400-99b8a0b23593?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      font-family: 'Inter', sans-serif;
    }
    /* Simple modal animation */
    .modal-enter {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-6">

  <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl max-w-6xl w-full p-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8 border-b pb-4">
      <h1 class="text-4xl font-bold text-cyan-700 tracking-tight">South Scene Cars</h1>
      <button onclick="openCreateModal()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-6 py-2 rounded-lg transition transform hover:scale-105 shadow-md">
        + Add Car
      </button>
    </div>

    <!-- Car Inventory Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse rounded-lg overflow-hidden">
        <thead class="bg-cyan-600 text-white uppercase text-sm">
          <tr>
            <th class="px-4 py-3">ID</th>
            <th class="px-4 py-3">Make</th>
            <th class="px-4 py-3">Model</th>
            <th class="px-4 py-3">License Plate</th>
            <th class="px-4 py-3">Year</th>
            <th class="px-4 py-3">Color</th>
            <th class="px-4 py-3">Body Type</th>
            <th class="px-4 py-3">Engine Type</th>
            <th class="px-4 py-3">Transmission</th>
            <th class="px-4 py-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="carTableBody" class="bg-white divide-y divide-gray-200">
          <!-- Car data rows will go here -->
          <tr class="hover:bg-cyan-50 transition">
            <td colspan="10" class="text-center py-6 text-gray-500 italic">No cars yet. Click “Add Car” to start.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div id="carModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 modal-enter">
      <h2 id="modalTitle" class="text-2xl font-bold text-cyan-700 mb-6">Add New Car</h2>

      <form id="carForm" onsubmit="saveCar(event)" class="space-y-4">
        <input type="hidden" id="carId">

        <div>
          <label class="block text-gray-700 font-medium mb-1">Make</label>
          <input id="carMake" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Model</label>
          <input id="carModel" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>
        
        <div>
          <label class="block text-gray-700 font-medium mb-1">License Plate</label>
          <input id="carLicensePlateNumber" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Year</label>
          <input id="carYear" type="number" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Color</label>
          <input id="carColor" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Body Type</label>
          <input id="carBodyType" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Engine Type</label>
          <input id="carEngineType" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Transmission</label>
          <input id="carTransmission" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none" required>
        </div>

        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-medium px-5 py-2 rounded-lg transition">
            Cancel
          </button>
          <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-5 py-2 rounded-lg transition">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
