<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<main>
    <!-- =================== Header =================== -->
    <header class="top-bar">
        <div class="title-container">
            <h1>🚘 Car Management System</h1>
            <p class="subtitle">Manage, search, and organize your car records easily</p>
        </div>

        <!-- Search Bar -->
        <form th:action="@{/}" method="get" class="search-form">
            <input type="text" name="search" placeholder="🔍 Search cars..." th:value="${param.search}">
            <button type="submit">Search</button>
        </form>

        <!-- Add Button -->
        <a th:href="@{/new}" class="btn add-btn">＋ Add Car</a>
    </header>

    <!-- =================== Table Section =================== -->
    <section class="table-container">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Make</th>
                <th>Year</th>
                <th>License Plate</th>
                <th>Color</th>
                <th>Body Type</th>
                <th>Engine</th>
                <th>Transmission</th>
                <th class="actions-col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="car, iterStat : ${cars}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${car.make}"></td>
                <td th:text="${car.year}"></td>
                <td th:text="${car.licensePlateNumber}"></td>
                <td th:text="${car.color}"></td>
                <td th:text="${car.bodyType}"></td>
                <td th:text="${car.engineType}"></td>
                <td th:text="${car.transmission}"></td>
                <td class="action-buttons">
                    <a th:href="@{/edit(id=${car.id})}" class="btn edit">✏️ Edit</a>
                    <a th:href="@{/delete(id=${car.id})}" class="btn delete"
                       onclick="return confirm('Are you sure you want to delete this car?');">
                        🗑️ Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(cars)}">
                <td colspan="9" class="empty-row">🚫 No cars found</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
