<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>React To-Do App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              skyblue: "#38BDF8",
              mint: "#A7F3D0",
              midnight: "#1E293B",
              lavender: "#C7D2FE",
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-gradient-to-br from-skyblue via-lavender to-mint flex justify-center items-center min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
      function Task({ task, onToggle, onDelete }) {
        return (
          <li className="flex items-center justify-between bg-white/80 backdrop-blur-sm px-4 py-3 mb-3 rounded-2xl shadow-sm hover:shadow-md hover:bg-white/90 transition">
            <div className="flex items-center gap-3 flex-1">
              <input
                type="checkbox"
                checked={task.isDone}
                onChange={onToggle}
                className="w-5 h-5 accent-skyblue cursor-pointer"
              />
              <span
                onClick={onToggle}
                className={`cursor-pointer select-none ${
                  task.isDone
                    ? "line-through text-gray-400"
                    : "text-midnight font-medium"
                }`}
              >
                {task.title}
              </span>
            </div>

            <button
              onClick={onDelete}
              className="ml-3 px-3 py-1 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600 transition"
            >
              ✕
            </button>
          </li>
        );
      }

      function App() {
        const [tasks, setTasks] = React.useState([
          { title: "Watch Kdrama", isDone: false },
          { title: "1 Hour training in table tennis", isDone: false },
          { title: "Play Valorant", isDone: false },
        ]);
        const [newTask, setNewTask] = React.useState("");
        const [error, setError] = React.useState("");

        const addTask = () => {
          if (newTask.trim() === "") {
            setError("Please enter a task before adding.");
            return;
          }
          setTasks([...tasks, { title: newTask.trim(), isDone: false }]);
          setNewTask("");
          setError("");
        };

        const toggleTask = (index) => {
          const updated = [...tasks];
          updated[index].isDone = !updated[index].isDone;
          setTasks(updated);
        };

        const deleteTask = (index) => {
          setTasks(tasks.filter((_, i) => i !== index));
        };

        return (
          <div className="bg-white/70 backdrop-blur-md shadow-2xl rounded-3xl p-8 w-96 border border-white/40">
            <h2 className="text-3xl font-extrabold text-center text-midnight mb-6 drop-shadow-sm">
              🌈 My To-Do List
            </h2>

            <div className="flex mb-3">
              <input
                type="text"
                value={newTask}
                onChange={(e) => {
                  setNewTask(e.target.value);
                  setError("");
                }}
                placeholder="Enter a new task..."
                className="flex-1 px-4 py-2 border border-midnight/30 text-midnight bg-white/80 rounded-l-xl focus:outline-none focus:ring-2 focus:ring-skyblue placeholder-gray-400"
              />
              <button
                onClick={addTask}
                className="px-5 py-2 bg-skyblue text-white rounded-r-xl hover:bg-sky-400 transition font-semibold"
              >
                Add
              </button>
            </div>

            {error && (
              <p className="text-red-600 text-sm mb-3 text-center">{error}</p>
            )}

            <ul>
              {tasks.map((task, index) => (
                <Task
                  key={index}
                  task={task}
                  onToggle={() => toggleTask(index)}
                  onDelete={() => deleteTask(index)}
                />
              ))}
            </ul>

            {tasks.length === 0 && (
              <p className="text-center text-gray-600 mt-4 italic">
                No tasks yet. Add one!
              </p>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
